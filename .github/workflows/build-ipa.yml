# Build an unsigned IPA on a GitHub-hosted macOS runner.
#
# This workflow does not sign or install anything: it produces
# build/DSH-unsigned.ipa, which you sign with your own on-device signer.
# Run it from Actions -> "Build unsigned IPA" -> Run workflow.
name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner image (xcode-27 is arm64 and carries Xcode 27)
        type: choice
        options:
          - xcode-27
          - macos-26
          - macos-15
        default: xcode-27
      bundle_id:
        description: Bundle identifier to build (change it if your signer needs a unique id)
        type: string
        default: com.xnuapp.dsh

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ inputs.runner || 'xcode-27' }}
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          uname -a
          sw_vers
          if [ -d /Applications/Xcode.app ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep -E 'iphoneos|iOS' || true

      - name: Install build tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install meson ninja lld libarchive
          # Xcode's meson build phase resolves tools through the login PATH;
          # /usr/local/bin is always present there on macOS runners.
          for tool in meson ninja; do
            sudo ln -sf "$(command -v "$tool")" "/usr/local/bin/$tool"
          done
          command -v ld.lld
          command -v meson
          command -v ninja

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rootfs/staging/package-lock.json

      - name: Restore guest image cache
        id: rootfs-cache
        uses: actions/cache@v4
        with:
          path: |
            build/root.tar.gz
            build/root.tar.gz.sha256
          key: rootfs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rootfs/**', 'scripts/build-rootfs.sh', 'ish-arm64/**') }}

      - name: Build iSH-ARM64 emulator
        run: make emulator

      - name: Build guest rootfs (Alpine + Node 22 + dsh)
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        run: make rootfs

      - name: Archive unsigned app
        env:
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          set -o pipefail
          rm -rf build/DSH.xcarchive
          mkdir -p build
          xcodebuild \
            -project DSH.xcodeproj \
            -scheme DSH \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/DSH.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            DSH_DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            archive 2>&1 | tee build/xcodebuild.log

      - name: Package unsigned IPA
        run: scripts/make-unsigned-ipa.sh

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: DSH-unsigned-ipa-${{ github.run_number }}
          path: |
            build/DSH-unsigned.ipa
            build/DSH-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload xcodebuild log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ github.run_number }}
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
